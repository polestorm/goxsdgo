name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", "stable"]
        os: [ubuntu-latest, macos-latest]
        exclude:
          # konsolidator Go 1.22 tworzy programy bez LC_UUID, których nowy macOS nie uruchamia
          - go: "1.22"
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      # dane testowe (ADR 0003): pobierane według manifestu, w pamięci podręcznej według jego sumy
      - uses: actions/cache@v4
        with:
          path: |
            testdata/w3c/xsdtests
            testdata/w3c/xmlconf
            testdata/w3c/schemas
            testdata/schemas/mf
            testdata/instances/mf
          key: testdata-${{ hashFiles('testdata/sources.json') }}
      - name: fetch test data
        run: go -C tools/fetch run . -root ../..
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)"
      - name: no dependencies in the library module
        if: matrix.os == 'ubuntu-latest'
        run: "! grep -q '^require' go.mod"
      - name: no cgo in the library
        if: matrix.os == 'ubuntu-latest'
        run: CGO_ENABLED=0 go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: fetch tool
        run: go -C tools/fetch vet ./... && go -C tools/fetch test ./...

  # wersja narzędzia w Pythonie (tools/fetch/fetch.py) dla osób bez Go, m.in. na Windows
  fetch-python:
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 nie jest już dostępny w GitHub Actions; zgodność z 3.9 sprawdzana lokalnie (3.9.6)
        python: ["3.10", "3.x"]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tools/fetch -v
