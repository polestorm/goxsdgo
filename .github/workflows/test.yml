name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        go: ["1.22", "stable"]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)"
      - name: no dependencies in the library module
        if: matrix.os == 'ubuntu-latest'
        run: "! grep -q '^require' go.mod"
      - name: no cgo in the library
        if: matrix.os == 'ubuntu-latest'
        run: CGO_ENABLED=0 go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: fetch tool
        run: go -C tools/fetch vet ./... && go -C tools/fetch test ./...

  # wersja narzędzia w Pythonie (tools/fetch/fetch.py) dla osób bez Go, m.in. na Windows
  fetch-python:
    strategy:
      matrix:
        python: ["3.9", "3.x"]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tools/fetch -v
